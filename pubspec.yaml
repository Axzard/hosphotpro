name: hotspotsio
description: "Hotspotsio - Smart Hotspot Management"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter_blue_plus: ^2.1.1
  dio: ^5.9.1
  esc_pos_utils_plus: ^2.0.4
  flutter:
    sdk: flutter
  get: ^4.7.3
  google_fonts: ^8.0.1
  intl: ^0.20.2
  midtrans_sdk: ^1.2.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  permission_handler: ^12.0.1
  printing: ^5.14.2
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  socket_io_client: ^2.0.3
  webview_flutter: ^4.10.0
  fl_chart: ^0.70.2
  window_manager: ^0.4.3
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - assets/siodef.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  windows:
    generate: true
    image_path: "assets/siodef.png"
  image_path: "assets/siodef.png"
  min_sdk_android: 21